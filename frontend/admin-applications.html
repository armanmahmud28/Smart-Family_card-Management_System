<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্মার্ট ফ্যামিলি কার্ড সিস্টেম - আবেদনসমূহ</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-people-roof" style="color: var(--accent); font-size: 1.8rem;"></i>
        <h2>অ্যাডমিন প্যানেল</h2>
      </div>
      <ul class="sidebar-menu">
        <li><a href="admin-dashboard.html">ড্যাশবোর্ড</a></li>
        <li class="active"><a href="admin-applications.html">আবেদনসমূহ</a></li>
        <li><a href="admin-payments.html">ভাতা পরিচালনা</a></li>
        <li><a href="admin-complaints.html">অভিযোগসমূহ</a></li>
        <li style="margin-top: auto;"><a href="#logout" class="text-danger">লগআউট</a></li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div></div> <!-- Menu toggle injected here -->
        <div class="user-profile">
          <div class="user-info text-right">
            <span class="user-name">অফিসার</span>
            <span class="user-role">কর্মকর্তা</span>
          </div>
        </div>
      </header>

      <div class="content animate-fade-up">
        <div class="page-header">
          <h1 class="page-title">সকল আবেদন</h1>
          <p class="text-muted">আপনার এলাকার নাগরিকদের আবেদন পর্যালোচনা করুন</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <div class="table-container">
          <table id="admin-apps-table">
            <thead>
              <tr>
                <th>আইডি</th>
                <th>নাগরিকের নাম</th>
                <th>ফোন নম্বর</th>
                <th>NID</th>
                <th>ফ্রড রিস্ক</th>
                <th>স্কোর</th>
                <th>অবস্থা</th>
                <th>অ্যাকশন</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="8" class="text-center">লোড হচ্ছে...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const res = await fetchWithAuth('/admin/applications');
      if (res.success && res.applications) {
        const tbody = document.querySelector('#admin-apps-table tbody');
        tbody.innerHTML = '';
        if (res.applications.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center">কোনো আবেদন পাওয়া যায়নি</td></tr>';
        } else {
          res.applications.forEach(app => {
            const fraudClass = app.fraud_risk_score > 50 ? 'rejected' : (app.fraud_risk_score > 30 ? 'pending' : 'approved');
            const elClass = app.eligibility_score >= 70 ? 'approved' : 'pending';
            
            let statusText = app.status;
            let statusClass = 'pending';
            if(app.status === 'approved') statusClass = 'approved';
            if(app.status === 'rejected') statusClass = 'rejected';

            const adminRole = localStorage.getItem('adminRole') || 'officer';
            let canAct = false;
            if (app.status !== 'approved' && app.status !== 'rejected') {
              if (adminRole === 'officer' && app.approval_level === 'none') canAct = true;
              if (adminRole === 'admin' && (app.approval_level === 'none' || app.approval_level === 'local_officer')) canAct = true;
              if (adminRole === 'super_admin') canAct = true;
            }

            tbody.innerHTML += `
              <tr id="row-${app.id}">
                <td>#APP-${app.id}</td>
                <td>${app.citizen ? app.citizen.full_name : '-'}</td>
                <td>${app.citizen ? app.citizen.phone : '-'}</td>
                <td>${app.citizen ? app.citizen.nid : '-'}</td>
                <td><span class="badge ${fraudClass}">${app.fraud_risk_score || 0}%</span></td>
                <td><span class="badge ${elClass}">${app.eligibility_score || 0}</span></td>
                <td><span class="badge ${statusClass}">${statusText}</span></td>
                <td>
                  ${canAct ? `
                  <div style="display:flex; gap: 0.5rem;">
                    <button class="btn-primary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; background: var(--success);" onclick="updateStatus(${app.id}, 'approved')"><i class="fa-solid fa-check"></i></button>
                    <button class="btn-primary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; background: var(--danger);" onclick="updateStatus(${app.id}, 'rejected')"><i class="fa-solid fa-xmark"></i></button>
                  </div>
                  ` : '-'}
                </td>
              </tr>
            `;
          });
        }
      }
    });

    window.updateStatus = async (appId, status) => {
      if(!confirm(`আপনি কি আবেদনটি ${status === 'approved' ? 'অনুমোদন' : 'বাতিল'} করতে চান?`)) return;
      
      const res = await fetchWithAuth(`/admin/applications/${appId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });

      if (res.success) {
        showAlert('সফলভাবে আপডেট করা হয়েছে', 'success');
        setTimeout(() => location.reload(), 1500);
      } else {
        showAlert(res.message, 'error');
      }
    };
  </script>
</body>
</html>
