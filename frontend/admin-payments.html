<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্মার্ট ফ্যামিলি কার্ড সিস্টেম - ভাতা পরিচালনা</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="animate-fade-in">
  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-people-roof" style="color: var(--accent); font-size: 1.8rem;"></i>
        <h2>অ্যাডমিন প্যানেল</h2>
      </div>
      <ul class="sidebar-menu">
        <li><a href="admin-dashboard.html"><i class="fa-solid fa-grid-2"></i> <span>ড্যাশবোর্ড</span></a></li>
        <li><a href="admin-applications.html"><i class="fa-solid fa-file-lines"></i> <span>আবেদনসমূহ</span></a></li>
        <li class="active"><a href="admin-payments.html"><i class="fa-solid fa-money-bill-transfer"></i> <span>ভাতা পরিচালনা</span></a></li>
        <li><a href="admin-complaints.html"><i class="fa-solid fa-triangle-exclamation"></i> <span>অভিযোগসমূহ</span></a></li>
        <li style="margin-top: auto;"><a href="#logout" class="text-danger logout-link"><i class="fa-solid fa-right-from-bracket"></i> <span>লগআউট</span></a></li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div></div>
        <div class="user-profile">
          <div class="user-info text-right">
            <span class="user-name" id="topbar-user-name">অফিসার</span>
            <span class="user-role" id="topbar-user-role">কর্মকর্তা</span>
          </div>
        </div>
      </header>

      <div class="content animate-fade-up">
        <div class="page-header">
          <h1 class="page-title">ভাতা পরিচালনা</h1>
          <p class="text-muted">এই মডিউলটি বর্তমানে তৈরি হচ্ছে (Coming Soon)</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const adminName = localStorage.getItem('adminName') || 'অ্যাডমিন';
      const adminRole = localStorage.getItem('adminRole') || 'কর্মকর্তা';
      const roleMap = { 'super_admin': 'সুপার অ্যাডমিন', 'admin': 'জেলা প্রশাসক', 'officer': 'স্থানীয় কর্মকর্তা' };
      
      const nameEl = document.getElementById('topbar-user-name');
      const roleEl = document.getElementById('topbar-user-role');
      if (nameEl) nameEl.textContent = adminName;
      if (roleEl) roleEl.textContent = roleMap[adminRole] || adminRole;
    });
  </script>
</body>
</html>
