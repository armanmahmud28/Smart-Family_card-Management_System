<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্মার্ট ফ্যামিলি কার্ড সিস্টেম - পাসওয়ার্ড পুনরুদ্ধার</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-left" style="background: rgba(0,0,0,0.2);">
      <div class="login-left-content animate-fade-up">
        <i class="fa-solid fa-unlock-keyhole" style="font-size: 5rem; color: #a7f3d0; margin-bottom: 2rem; animation: float 6s ease-in-out infinite;"></i>
        <h1>পাসওয়ার্ড পুনরুদ্ধার</h1>
        <p>আপনার মোবাইল নম্বর দিয়ে ওটিপি (OTP) গ্রহণ করুন</p>
      </div>
    </div>
    <div class="login-right">
      <div class="login-card animate-fade-up">
        <h2>পাসওয়ার্ড রিসেট</h2>
        <div id="alert-box" class="alert"></div>
        
        <!-- Step 1: Request OTP -->
        <form id="otp-request-form">
          <div class="form-group">
            <label for="phone">মোবাইল নম্বর</label>
            <input type="text" id="phone" placeholder="আপনার মোবাইল নম্বর লিখুন" required>
          </div>
          <button type="submit" class="btn-primary" id="btn-get-otp">OTP পাঠান <i class="fa-solid fa-paper-plane"></i></button>
        </form>

        <!-- Step 2: Verify OTP and Reset -->
        <form id="reset-password-form" style="display: none;">
          <div class="form-group">
            <label for="otp">OTP কোড</label>
            <input type="text" id="otp" placeholder="আপনার মোবাইলে প্রাপ্ত ৬ ডিজিটের কোড" required>
          </div>
          <div class="form-group">
            <label for="new_password">নতুন পাসওয়ার্ড</label>
            <input type="password" id="new_password" placeholder="নতুন পাসওয়ার্ড লিখুন" required>
          </div>
          <button type="submit" class="btn-primary">পাসওয়ার্ড পরিবর্তন করুন</button>
        </form>
        
        <div class="login-divider">অথবা</div>
        <button type="button" onclick="window.location.href='index.html'" class="btn-secondary">লগইন পেজে ফিরে যান</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('otp-request-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value;
      const btn = document.getElementById('btn-get-otp');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> পাঠানো হচ্ছে...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_URL}/auth/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        const data = await res.json();
        
        if (data.success) {
          showAlert('OTP পাঠানো হয়েছে! (কনসোলে চেক করুন)', 'success');
          document.getElementById('otp-request-form').style.display = 'none';
          document.getElementById('reset-password-form').style.display = 'block';
        } else {
          showAlert(data.message, 'error');
          btn.innerHTML = 'OTP পাঠান <i class="fa-solid fa-paper-plane"></i>';
          btn.disabled = false;
        }
      } catch (err) {
        showAlert('সার্ভারে সমস্যা হচ্ছে।', 'error');
        btn.innerHTML = 'OTP পাঠান <i class="fa-solid fa-paper-plane"></i>';
        btn.disabled = false;
      }
    });

    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        phone: document.getElementById('phone').value,
        otp: document.getElementById('otp').value,
        newPassword: document.getElementById('new_password').value
      };

      try {
        const res = await fetch(`${API_URL}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (data.success) {
          showAlert('পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!', 'success');
          setTimeout(() => window.location.href = 'index.html', 2000);
        } else {
          showAlert(data.message, 'error');
        }
      } catch (err) {
        showAlert('সার্ভারে সমস্যা হচ্ছে।', 'error');
      }
    });
  </script>
</body>
</html>
